<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prep — company reports | Grit&amp;Gigs</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico?v=3"/>
<link rel="stylesheet" href="/css/main.css?v=3"/>
<link rel="stylesheet" href="/prep/prep.css?v=1"/>
</head>
<body>
<header class="topnav">
  <a class="nav-logo" href="/feed" title="Grit&Gigs home"><div class="nav-logo-mark"><img src="/logo.svg?v=3" alt="" width="32" height="32"></div><span class="nav-logo-text"><span class="logo-text-black">Grit</span><span class="logo-text-blue">&amp;Gigs</span></span></a>
  <div class="icons">
    <a href="/feed" title="Feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg></a>
    <a href="/explore.html" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.3 16.3 4.2 4.2"/></svg></a>
    <a class="badge" href="/messages.html" title="Messages"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="cnt" id="msgBadge" style="display:none;">0</span></a>
    <a href="/notifications.html" class="badge" title="Inbox"><svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5A4.7 4.7 0 0 1 19 13Z"/></svg><span class="cnt" id="notifBadge" style="display:none;">0</span></a>
    <a href="/orders.html" title="Orders"><svg viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2Z"/><path d="M3.3 8.3 12 13.3l8.7-5"/><path d="M12 13.3V21"/></svg></a>
    <a href="/prep" id="navPrep" title="Prep" class="on"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M9 7.5h6"/></svg></a>
    <a href="/profile.html" id="navProfile" title="Profile"><img id="navAv" class="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/></a>
  </div>
</header>

<main class="prep-wrap">
  <section class="prep-card">
    <h1 class="prep-h1">Company reports</h1>
    <p class="prep-sub">Enter a company and the role you care about. The report sources every claim it shows and labels each one. Nothing here is legal advice.</p>
    <form id="prepSearchForm" autocomplete="off">
      <div class="prep-field">
        <label for="prepCompany">Company name</label>
        <input id="prepCompany" name="company" maxlength="200" placeholder="e.g. Infosys" required/>
      </div>
      <div class="prep-field">
        <label for="prepRole">Role</label>
        <input id="prepRole" name="role" maxlength="120" placeholder="e.g. graduate engineer trainee"/>
      </div>
      <div class="prep-field">
        <label for="prepUserType">I am a</label>
        <select id="prepUserType" name="userType">
          <option value="job-seeker">Job seeker</option>
          <option value="student">Student</option>
          <option value="employee">Employee</option>
        </select>
      </div>
      <button class="prep-btn" type="submit" id="prepSearchBtn">Find company</button>
      <div class="prep-err" id="prepSearchErr" role="alert"></div>
    </form>
    <ul class="prep-matches" id="prepMatches" hidden></ul>
  </section>

  <section class="prep-card">
    <div class="prep-empty" id="prepRecent">
      <b>Recent reports</b>
      Reports you open will show up here.
    </div>
  </section>

  <section class="prep-card">
    <div class="prep-empty">
      <b>Saved reports</b>
      Save a report to revisit it later.
    </div>
  </section>
</main>

<script src="/js/prep-nav.js?v=1" defer></script>
<script>
(function () {
  "use strict";
  var form = document.getElementById("prepSearchForm");
  var errEl = document.getElementById("prepSearchErr");
  var list = document.getElementById("prepMatches");
  var btn = document.getElementById("prepSearchBtn");
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errEl.textContent = "";
    list.hidden = true;
    list.innerHTML = "";
    var q = document.getElementById("prepCompany").value.trim();
    if (!q) { errEl.textContent = "Enter a company name."; return; }
    btn.disabled = true;
    fetch("/api/prep/companies?q=" + encodeURIComponent(q), { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (res.status !== 200 || !res.d.success) {
          errEl.textContent = (res.d && res.d.message) || "Search failed. Try again.";
          return;
        }
        var matches = res.d.data.matches || [];
        if (!matches.length) {
          errEl.textContent = "No company found yet. It can be added for review from the report page.";
          return;
        }
        matches.forEach(function (m) {
          var li = document.createElement("li");
          var role = document.getElementById("prepRole").value.trim();
          var qs = "/prep/report/" + encodeURIComponent(m.slug) + "?role=" + encodeURIComponent(role);
          li.innerHTML = '<a href="' + qs + '"><span>' + esc(m.name) + '</span>' +
            (m.status === "PENDING" ? '<span class="prep-chip pending">Pending review</span>' : "") + "</a>";
          list.appendChild(li);
        });
        list.hidden = false;
      })
      .catch(function () { btn.disabled = false; errEl.textContent = "Network error. Try again."; });
  });
})();
</script>
</body>
</html>
