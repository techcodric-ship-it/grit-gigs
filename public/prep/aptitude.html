<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aptitude practice | Prep | Grit&amp;Gigs</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico?v=3"/>
<link rel="stylesheet" href="/css/main.css?v=3"/>
<link rel="stylesheet" href="/prep/prep.css?v=1"/>
<style>
  .apt-option { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--prep-line); border-radius:10px; padding:10px 12px; margin-top:8px; cursor:pointer; }
  .apt-option:hover { border-color: var(--prep-violet); background: var(--prep-violet-light); }
  .apt-option input { margin-top:3px; accent-color: var(--prep-violet); }
  .apt-q { font-weight:700; color: var(--prep-ink); font-size:0.98rem; line-height:1.5; margin:14px 0 4px; }
  .apt-item + .apt-item { border-top:1px dashed var(--prep-line); margin-top:18px; padding-top:6px; }
  .apt-verdict { font-weight:800; font-size:0.85rem; }
  .apt-verdict.ok { color: var(--prep-violet-deep); }
  .apt-verdict.no { color: #C0392B; }
  .apt-expl { font-size:0.88rem; color: var(--prep-ink-2); background: var(--prep-surface2, #F7F7F9); border-radius:8px; padding:8px 10px; margin-top:8px; line-height:1.5; }
  .apt-score { font-size:1.6rem; font-weight:800; color: var(--prep-violet); }
  .apt-topics { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .apt-topic { border:1px solid var(--prep-line); background:#fff; border-radius:999px; padding:8px 16px; font:inherit; font-size:0.9rem; font-weight:700; cursor:pointer; color: var(--prep-ink-2); text-transform:capitalize; }
  .apt-topic[aria-pressed="true"] { background: var(--prep-violet); border-color: var(--prep-violet); color:#fff; }
</style>
</head>
<body>
<header class="topnav">
  <a class="nav-logo" href="/feed" title="Grit&Gigs home"><div class="nav-logo-mark"><img src="/logo.svg?v=3" alt="" width="32" height="32"></div><span class="nav-logo-text"><span class="logo-text-black">Grit</span><span class="logo-text-blue">&amp;Gigs</span></span></a>
  <div class="icons">
    <a href="/feed" title="Feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg></a>
    <a href="/explore.html" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.3 16.3 4.2 4.2"/></svg></a>
    <a class="badge" href="/messages.html" title="Messages"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="cnt" id="msgBadge" style="display:none;">0</span></a>
    <a href="/notifications.html" class="badge" title="Inbox"><svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5A4.7 4.7 0 0 1 19 13Z"/></svg><span class="cnt" id="notifBadge" style="display:none;">0</span></a>
    <a href="/orders.html" title="Orders"><svg viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2Z"/><path d="M3.3 8.3 12 13.3l8.7-5"/><path d="M12 13.3V21"/></svg></a>
    <a href="/prep" id="navPrep" title="Prep" class="on"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M9 7.5h6"/></svg></a>
    <a href="/profile.html" id="navProfile" title="Profile"><img id="navAv" class="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/></a>
  </div>
</header>

<main class="prep-wrap">
  <section class="prep-card">
    <h1 class="prep-h1">Aptitude practice</h1>
    <p class="prep-sub">Original practice questions in quant, logical and verbal. Answers are scored on the server — explanations unlock after you submit.</p>
    <div class="apt-topics" id="aptTopics"></div>
    <div class="prep-field">
      <label for="aptCount">Questions</label>
      <select id="aptCount">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="15">15</option>
      </select>
    </div>
    <button class="prep-btn" id="aptStart" type="button">Start quiz</button>
    <div class="prep-err" id="aptErr" role="alert"></div>
  </section>

  <section class="prep-card" id="aptQuizCard" hidden>
    <div id="aptQuizForm"></div>
    <button class="prep-btn" id="aptSubmit" type="button" style="margin-top:16px;">Submit answers</button>
  </section>

  <section class="prep-card" id="aptResultCard" hidden>
    <div class="apt-score" id="aptScore"></div>
    <div id="aptResults"></div>
    <button class="prep-btn" id="aptAgain" type="button" style="margin-top:16px;">Try another quiz</button>
  </section>
</main>

<script src="/js/prep-nav.js?v=1" defer></script>
<script>
(function () {
  "use strict";
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var errEl = document.getElementById("aptErr");
  var topicsEl = document.getElementById("aptTopics");
  var quizCard = document.getElementById("aptQuizCard");
  var resultCard = document.getElementById("aptResultCard");
  var quizForm = document.getElementById("aptQuizForm");
  var selectedTopic = "quant";
  var token = "";
  var questions = [];

  function loadTopics() {
    fetch("/api/prep/aptitude/topics", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var topics = (d && d.success && d.data.topics) || [];
        if (!topics.length) { errEl.textContent = "Question bank is being prepared. Check back soon."; return; }
        selectedTopic = topics[0].topic;
        topicsEl.innerHTML = "";
        topics.forEach(function (t) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "apt-topic";
          b.textContent = t.topic + " (" + t.count + ")";
          b.setAttribute("aria-pressed", t.topic === selectedTopic ? "true" : "false");
          b.addEventListener("click", function () {
            selectedTopic = t.topic;
            Array.prototype.forEach.call(topicsEl.children, function (c) { c.setAttribute("aria-pressed", "false"); });
            b.setAttribute("aria-pressed", "true");
          });
          topicsEl.appendChild(b);
        });
      })
      .catch(function () { errEl.textContent = "Could not load topics. Try again."; });
  }

  function renderQuiz(list, tok) {
    questions = list;
    token = tok;
    quizForm.innerHTML = list.map(function (q, i) {
      var opts = q.options.map(function (o, oi) {
        return '<label class="apt-option"><input type="radio" name="q_' + esc(q.id) + '" value="' + oi + '"><span>' + esc(o) + "</span></label>";
      }).join("");
      return '<div class="apt-item"><div class="apt-q">' + (i + 1) + ". " + esc(q.question) + "</div>" + opts + "</div>";
    }).join("");
    quizCard.hidden = false;
    resultCard.hidden = true;
    quizCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.getElementById("aptStart").addEventListener("click", function () {
    errEl.textContent = "";
    var count = document.getElementById("aptCount").value;
    fetch("/api/prep/aptitude/quiz?topic=" + encodeURIComponent(selectedTopic) + "&count=" + encodeURIComponent(count), { credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status !== 200 || !res.d.success) {
          errEl.textContent = (res.d && res.d.message) || "Could not start the quiz.";
          return;
        }
        renderQuiz(res.d.data.questions, res.d.data.token);
      })
      .catch(function () { errEl.textContent = "Network error. Try again."; });
  });

  document.getElementById("aptSubmit").addEventListener("click", function () {
    errEl.textContent = "";
    var answers = {};
    var answered = 0;
    questions.forEach(function (q) {
      var picked = quizForm.querySelector('input[name="q_' + q.id + '"]:checked');
      if (picked) { answers[q.id] = Number(picked.value); answered++; }
    });
    if (!questions.length) return;
    if (answered < questions.length && !confirm("You have " + (questions.length - answered) + " unanswered. Submit anyway?")) return;
    fetch("/api/prep/aptitude/submit", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: token, answers: answers }),
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        if (res.status === 400) { errEl.textContent = res.d.message; return; }
        if (res.status !== 200 || !res.d.success) {
          errEl.textContent = (res.d && res.d.message) || "Scoring failed.";
          return;
        }
        var data = res.d.data;
        document.getElementById("aptScore").textContent = data.score + " / " + data.total;
        document.getElementById("aptResults").innerHTML = data.results.map(function (r, i) {
          var verdict = r.correct
            ? '<span class="apt-verdict ok">Correct</span>'
            : '<span class="apt-verdict no">Incorrect</span>';
          var options = r.options.map(function (o, oi) {
            var mark = oi === r.correctIdx ? " ✓" : (oi === r.yourAnswer && !r.correct ? " ✗" : "");
            return "<div>" + (oi + 1) + ". " + esc(o) + esc(mark) + "</div>";
          }).join("");
          return '<div class="apt-item"><div class="apt-q">' + (i + 1) + ". " + esc(r.question) + "</div>" + verdict +
            '<div style="margin-top:6px;">' + options + '</div><div class="apt-expl">' + esc(r.explanation) + "</div></div>";
        }).join("");
        quizCard.hidden = true;
        resultCard.hidden = false;
        resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
      })
      .catch(function () { errEl.textContent = "Network error. Try again."; });
  });

  document.getElementById("aptAgain").addEventListener("click", function () {
    resultCard.hidden = true;
    quizCard.hidden = true;
    document.getElementById("aptTopics").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  loadTopics();
})();
</script>
</body>
</html>
