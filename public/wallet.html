<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Wallet — Grit&Gigs</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3"/>
<link rel="stylesheet" href="/assets/feed.css"/>
<style>
  body{background:var(--bg,#fbfaff);color:var(--text,#1a1a2e);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);}
  .topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line,#eee);}
  .topnav .brand{font-weight:800;font-size:1.15rem;color:var(--ink,#1a1a2e);text-decoration:none;}
  .topnav .brand b{color:var(--violet,#6C3FE8);}
  .topnav .icons{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .topnav .icons a{width:34px;height:34px;line-height:34px;text-align:center;border-radius:10px;text-decoration:none;font-size:1rem;color:#999;transition:.16s;}
  .topnav .icons a:hover,.topnav .icons a.on{background:var(--bg-alt,#f4f1ff);color:var(--violet,#6C3FE8);}
  .wrap{max-width:760px;margin:0 auto;padding:26px 20px 60px;}
  .card{background:#fff;border:1px solid var(--line,#eee);border-radius:16px;padding:20px;margin-bottom:18px;}
  h2{font-size:1.35rem;margin:0 0 4px;}
  .sub{color:var(--text-muted,#777);font-size:0.92rem;margin-bottom:16px;}
  .balance-big{font-size:2.1rem;font-weight:800;color:var(--ink,#1a1a2e);}
  .balance-lbl{color:var(--text-muted,#999);font-size:0.85rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:0.92rem;cursor:pointer;text-decoration:none;transition:.15s;}
  .primary{background:var(--violet,#6C3FE8);color:#fff;}
  .primary:hover{background:#5a34c6;}
  .ghost{background:var(--bg-alt,#f4f1ff);color:var(--violet,#6C3FE8);}
  .ghost:hover{background:#e9e2ff;}
  .mini{width:100%;border-radius:10px;background:#fdfdfe;}
  .mini .sep{height:1px;background:var(--line,#eee);margin:14px 0;}
  .mini h4{font-size:0.95rem;margin:0 0 8px;}
  .txn{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line,#f3f3f6);}
  .txn:last-child{border-bottom:none;}
  .txn .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;background:var(--bg-alt,#f4f1ff);}
  .txn .b{flex:1;min-width:0;}
  .txn .t{font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .txn .d{font-size:0.78rem;color:var(--text-muted,#999);}
  .txn .a{font-weight:700;font-size:0.95rem;}
  .credit{color:var(--green,#1a9e6c);}
  .debit{color:var(--signal,#8a2be2);}
  .fld{margin-bottom:14px;}
  .fld label{display:block;font-size:0.82rem;font-weight:600;color:var(--text,#1a1a2e);margin-bottom:6px;}
  .fld input,.fld select{width:100%;box-sizing:border-box;border:1px solid var(--line,#ddd);border-radius:10px;padding:11px 12px;font-size:0.95rem;background:#fff;}
  .err{color:var(--signal,#e03d52);font-size:0.85rem;min-height:1em;margin-top:4px;}
  .empty{text-align:center;color:var(--text-muted,#999);padding:18px 0;font-size:0.9rem;}
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(20,15,40,.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;}
  .modal h3{margin:0 0 4px;}
  .modal .fa{width:18px;color:var(--signal,#8a2be2);}
</style>
</head>
<body>
<header class="topnav">
  <a class="brand" href="/feed">Grit<b>&amp;Gigs</b></a>
  <div class="icons">
    <a href="/wallet.html" class="on" title="Wallet">₹</a>
    <a href="/buy-more.html" title="Buy more">➕</a>
    <a href="/orders.html" title="Orders">📦</a>
    <a href="/settings.html" title="Settings">⚙</a>
    <a href="/feed" title="Feed">🏠</a>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Wallet</h2>
    <div class="sub">Your money, protected on the platform. Add funds, then spend on orders, gigs and credits.</div>
    <div class="balance-lbl">
      <div>
        <div class="balance-big" id="balance">₹0</div>
        <div style="color:var(--text-muted,#999);font-size:0.85rem;margin-top:2px;">Available balance</div>
      </div>
      <div style="text-align:right;">
        <div style="font-weight:700;color:var(--green,#1a9e6c);" id="earned">₹0</div>
        <div style="color:var(--text-muted,#999);font-size:0.85rem;">Total earned</div>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="topUp">+ Add money</button>
      <a class="btn ghost" href="/buy-more.html">Buy more credits</a>
    </div>
  </div>

  <div class="card mini">
    <h4>Recent transactions</h4>
    <div id="txns"><div class="empty">Loading…</div></div>
  </div>
</div>

<!-- top-up modal -->
<div class="modal-backdrop" id="topUpModal">
  <div class="modal">
    <h3>Add money to wallet</h3>
    <div class="sub">Security-checked &amp; encrypted. Instant credit after payment.</div>
    <div class="fld"><label>Amount (₹)</label><input type="number" id="amt" placeholder="500" min="1"/></div>
    <div class="fld">
      <label>Payment method</label>
      <select id="method">
        <option value="razorpay">UPI / Cards / Netbanking (Razorpay)</option>
      </select>
    </div>
    <div class="err" id="upErr"></div>
    <div class="row">
      <button class="btn ghost" id="upCancel">Cancel</button>
      <button class="btn primary" id="upSubmit">Pay ₹0</button>
    </div>
  </div>
</div>

<script src="/assets/common.js"></script>
<script>
(function () {
  var c = window.core || window.community || (function () {
    var t = localStorage.getItem("se_token");
    return { token: function(){return t;}, esc: function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});} };
  })();
  function $(x){return document.getElementById(x);}
  var API = "/api";
  function authed() { return !!(c.token && c.token()); }
  function api(ep, o) {
    o = o || {};
    var h = Object.assign({ "Content-Type": "application/json" }, o.headers || {});
    if (c.token && c.token()) h.Authorization = "Bearer " + c.token();
    var cfg = { method: o.method || "GET", headers: h };
    if (o.body) cfg.body = typeof o.body === "string" ? o.body : JSON.stringify(o.body);
    return fetch(API + ep, cfg).then(function (r){ return r.json(); }).then(function (d){ return d; }).catch(function(){ return { success:false, message:"Cannot reach server" }; });
  }
  var esc = c.esc;

  if (!authed()) { window.location.href = "/feed"; return; }

  var txnIcon = { CREDIT_PURCHASE:"💳", CREDITS_REWARD:"🎁", SERVICE_PAYMENT:"📦", SERVICE_EARNING:"💸", WITHDRAWAL:"🏦", REFUND:"↩", COMMISSION:"🏛", REFERRAL_REWARD:"👥", PROJECT_REWARD:"📋" };

  function load() {
    api("/users/me/wallet").then(function (r) {
      if (!r.success) { $("balance").textContent = "₹0"; return; }
      var d = r.data || {};
      var bal = Number(d.balance || 0);
      $("balance").textContent = "₹" + bal.toLocaleString("en-IN");
      if (d.totalEarned != null) $("earned").textContent = "₹" + Number(d.totalEarned).toLocaleString("en-IN");
      renderTxns(d.recentTransactions || d.transactions || []);
    });
  }

  function renderTxns(list) {
    var el = $("txns");
    if (!list || !list.length) { el.innerHTML = '<div class="empty">No transactions yet — add money to get rolling.</div>'; return; }
    el.innerHTML = "";
    list.slice(0, 20).forEach(function (t) {
      var amt = Number(t.amount || 0);
      var out = t.type === "WITHDRAWAL" || t.type === "SERVICE_PAYMENT" || t.type === "COMMISSION" || t.type === "PROJECT_REWARD" ? -1 : 1;
      var sign = out < 0 ? "-" : "+";
      var div = document.createElement("div");
      div.className = "txn";
      div.innerHTML =
        '<div class="ic">' + (txnIcon[t.type] || "💠") + '</div>' +
        '<div class="b"><div class="t">' + esc(t.description || t.type || "Transaction") + '</div>' +
        '<div class="d">' + esc(new Date(t.createdAt || Date.now()).toLocaleString("en-IN")) + '</div></div>' +
        '<div class="a ' + (out < 0 ? "debit" : "credit") + '" style="direction:rtl;">' + sign + "₹" + amt.toLocaleString("en-IN") + '</div>';
      el.appendChild(div);
    });
  }

  $("topUp").addEventListener("click", function(){ $("topUpModal").classList.add("open"); });
  $("upCancel").addEventListener("click", function(){ $("topUpModal").classList.remove("open"); });
  $("topUpModal").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("open"); });
  $("amt").addEventListener("input", function(){ var a=Number(this.value); $("upSubmit").textContent="Pay ₹"+ (isFinite(a)?a.toLocaleString("en-IN"):0); });

  $("upSubmit").addEventListener("click", function(){
    var amt = Number($("amt").value);
    if (!amt || amt < 1) { $("upErr").textContent="Enter a valid amount (min ₹1)."; return; }
    var btn = this; btn.disabled = trueIntern;
    $("upErr").textContent = "";
    api("/credits/create-order", { method:"POST", body:{ amount:amt } }).then(function (r) {
      if (!r.success || !r.data || !r.data.order || !r.data.key) {
        $("upErr").textContent = (r.message || "Payment gateway not ready.") + " Add your Razorpay keys in .env to go live.";
        btn.disabled = false; return;
      }
      var o = r.data.order;
      var amountPaise = Number(o.amount || amt * 100);
      // Razorpay checkout modal
      if (typeof window.Razorpay === "undefined") {
        var s = document.createElement("script");
        s.src = "https://checkout.razorpay.com/v1/checkout.js";
        s.onload = function(){ openCheckout(o.id, amountPaise, amt); };
        document.head.appendChild(s);
      } else { openCheckout(o.id, amountPaise, amt); }
    });
  });

  function openCheckout(orderId, amountPaise, amt) {
    var opts = {
      key: $("rzKey") ? $("rzKey").textContent : "",
    };
    // configure with key from server
    api("/credits/create-order", { method:"POST", body:{ amount: amt, dryRun:true } }).then(function(){});
    // Use the key provided by /credits/create-order — stored earlier via window var
    opts = {
      key: (window.__rzKey || ""),
      amount: amountPaise,
      currency: "INR",
      name: "Grit&Gigs",
      description: "Wallet top-up",
      order_id: orderId,
      handler: function (resp) {
        verify(resp);
      },
      prefill: { contact: "", name: "" },
      theme: { color: "#6C3FE8" },
      modal: { ondismiss: function(){ location.reload(); } },
    };
    var rz = new window.Razorpay(opts);
    rz.on("payment.failed", function(){ $("upErr").textContent="Payment failed or cancelled."; });
    rz.open();
  }

  function verify(resp) {
    api("/credits/verify-payment", { method:"POST", body:{ razorpayOrderId: resp.razorpay_order_id, razorpayPaymentId: resp.razorpay_payment_id } }).then(function (r) {
      if (r.success) { $("topUpModal").classList.remove("open"); load(); }
      else { $("upErr").textContent = r.message || "Verification pending — we'll credit it shortly."; }
    });
  }

  load();
})();
</script>
