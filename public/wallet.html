<style> body{background:var(--bg,#fbfaff);color:var(--text,#1a1a2e);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);} .wrap{display:block;max-width:760px;margin:0 auto;padding:76px 20px 60px;} .card{background:#fff;border:1px solid var(--line,#eee);border-radius:16px;padding:20px;margin-bottom:18px;} h2{font-size:1.35rem;margin:0 0 4px;} .sub{color:var(--text-muted,#777);font-size:0.92rem;margin-bottom:16px;} .balance-big{font-size:2.1rem;font-weight:800;color:var(--ink,#1a1a2e);} .balance-lbl{color:var(--text-muted,#999);font-size:0.85rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;} .row{display:flex;gap:12px;flex-wrap:wrap;} .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:0.92rem;cursor:pointer;text-decoration:none;transition:.15s;} .primary{background:var(--violet,#6C3FE8);color:#fff;} .primary:hover{background:#5a34c6;} .ghost{background:var(--bg-alt,#f4f1ff);color:var(--violet,#6C3FE8);} .ghost:hover{background:#e9e2ff;} .mini{width:100%;border-radius:10px;background:#fdfdfe;} .mini .sep{height:1px;background:var(--line,#eee);margin:14px 0;} .mini h4{font-size:0.95rem;margin:0 0 8px;} .txn{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line,#f3f3f6);} .txn:last-child{border-bottom:none;} .txn .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;background:var(--bg-alt,#f4f1ff);} .txn .b{flex:1;min-width:0;} .txn .t{font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .txn .d{font-size:0.78rem;color:var(--text-muted,#999);} .txn .a{font-weight:700;font-size:0.95rem;} .credit{color:var(--green,#1a9e6c);} .debit{color:var(--signal,#8a2be2);} .fld{margin-bottom:14px;} .fld label{display:block;font-size:0.82rem;font-weight:600;color:var(--text,#1a1a2e);margin-bottom:6px;} .fld input,.fld select{width:100%;box-sizing:border-box;border:1px solid var(--line,#ddd);border-radius:10px;padding:11px 12px;font-size:0.95rem;background:#fff;} .err{color:var(--signal,#e03d52);font-size:0.85rem;min-height:1em;margin-top:4px;} .empty{text-align:center;color:var(--text-muted,#999);padding:18px 0;font-size:0.9rem;} .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(20,15,40,.5);z-index:100;align-items:center;justify-content:center;padding:20px;} .modal-backdrop.open{display:flex;} .modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;} .modal h3{margin:0 0 4px;} .modal .fa{width:18px;color:var(--signal,#8a2be2);}
</style>

</div> <!-- top-up modal -->
<div class="modal-backdrop" id="topUpModal"> <div class="modal"> <h3>Add money to wallet</h3> <div class="sub">Security-checked &amp; encrypted. Instant credit after payment.</div> <div class="fld"><label>Amount (₹)</label><input type="number" id="amt" placeholder="500" min="1"/></div> <div class="fld"> <label>Payment method</label> <select id="method"> <option value="razorpay">UPI / Cards / Netbanking (Razorpay)</option> </select> </div> <div class="err" id="upErr"></div> <div class="row"> <button class="btn ghost" id="upCancel">Cancel</button> <button class="btn primary" id="upSubmit">Pay ₹0</button> </div> </div>
</div> <script src="/assets/onboarding.js?v=1"></script> <script src="/assets/feed-app.js?v=16"></script>
<script>
(function () {
  var c = window.core || window.community || window.feed;
  function $(id) { return document.getElementById(id); }
  var esc = (c && c.esc) || function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); };
  function api(ep, o) {
    o = o || {};
    if (c && typeof c.api === 'function') {
      return c.api(ep, o).then(function (res) {
        if (res && res.status === 401) {
          setTimeout(function () { window.location.href = '/feed'; }, 1500);
          return { success: false, message: 'Session expired — please sign in again.' };
        }
        return (res && res.d) || { success: false, message: 'Cannot reach server' };
      }).catch(function () { return { success: false, message: 'Cannot reach server' }; });
    }
    var h = Object.assign({ 'Content-Type': 'application/json' }, o.headers || {});
    if (c.token && c.token()) h.Authorization = 'Bearer ' + c.token();
    var cfg = { method: o.method || 'GET', headers: h };
    if (o.body) cfg.body = typeof o.body === 'string' ? o.body : JSON.stringify(o.body);
    return fetch('/api' + ep, cfg)
      .then(function (r) { return r.json(); })
      .catch(function () { return { success: false, message: 'Cannot reach server' }; });
  }
  function msg(r) {
    if (!r) return 'Cannot reach server';
    if (r.message) return r.message;
    if (r.error) return r.error;
    return 'Something went wrong';
  }

  if (!(c && c.token && c.token())) { window.location.href = '/feed'; return; }

  try {
    var m0 = c.me && c.me();
    if (m0) {
      var navA = $('navAv'); if (navA) navA.src = c.avatarFor(m0);
      var pp = $('navProfile'); if (pp) pp.setAttribute('href', '/profile.html?id=' + encodeURIComponent(m0.id));
    }
  } catch (e) {}

  var txnIcon = { CREDIT_PURCHASE: '\ud83d\udcb3', CREDITS_REWARD: '\ud83c\udf81', SERVICE_PAYMENT: '\ud83d\udce6', SERVICE_EARNING: '\ud83d\udcb8', WITHDRAWAL: '\ud83f\udfe6', REFUND: '\u21a9', COMMISSION: '\ud83c\udfdb', REFERRAL_REWARD: '\ud83d\udc65', PROJECT_REWARD: '\ud83d\udccb' };
  var isOut = function (t) { return t === 'WITHDRAWAL' || t === 'SERVICE_PAYMENT' || t === 'COMMISSION' || t === 'PROJECT_REWARD'; };

  function renderTxns(list) {
    var el = $('txns');
    if (!list || !list.length) { el.innerHTML = '<div class="empty">No transactions yet - add money to get rolling.</div>'; return; }
    el.innerHTML = '';
    list.slice(0, 20).forEach(function (t) {
      var amt = Number(t.amount || 0);
      var out = isOut(t.type);
      var sign = out ? '-' : '+';
      var div = document.createElement('div');
      div.className = 'txn';
      div.innerHTML = '<div class="ic">' + (txnIcon[t.type] || '\ud83d\udca0') + '</div>' +
        '<div class="b"><div class="t">' + esc(t.description || t.type || 'Transaction') + '</div>' +
        '<div class="d">' + esc(new Date(t.createdAt || Date.now()).toLocaleString('en-IN')) + '</div></div>' +
        '<div class="a ' + (out ? 'debit' : 'credit') + '">' + sign + '\u20b9' + amt.toLocaleString('en-IN') + '</div>';
      el.appendChild(div);
    });
  }

  function load() {
    api('/users/me/wallet').then(function (r) {
      if (!r.success) { $('balance').textContent = '\u20b90'; return; }
      var d = r.data || {};
      var w = d.wallet || {};
      var bal = Number(w.balance || 0);
      $('balance').textContent = '\u20b9' + bal.toLocaleString('en-IN');
      if (w.totalEarned != null) $('earned').textContent = '\u20b9' + Number(w.totalEarned).toLocaleString('en-IN');
      renderTxns(d.recentTransactions || d.transactions || []);
    });
  }

  $('topUp').addEventListener('click', function () { $('topUpModal').classList.add('open'); });
  $('upCancel').addEventListener('click', function () { $('topUpModal').classList.remove('open'); });
  $('topUpModal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
  $('amt').addEventListener('input', function () {
    var a = Number(this.value);
    $('upSubmit').textContent = 'Pay \u20b9' + (isFinite(a) && a > 0 ? a.toLocaleString('en-IN') : 0);
  });

  function verify(resp) {
    api('/credits/verify-payment', {
      method: 'POST',
      body: { razorpayOrderId: resp.razorpay_order_id, razorpayPaymentId: resp.razorpay_payment_id }
    }).then(function (r) {
      if (r.success) { $('topUpModal').classList.remove('open'); load(); }
      else $('upErr').textContent = msg(r);
    }).catch(function () { $('upErr').textContent = "Verification pending - we'll credit it shortly."; });
  }

  $('upSubmit').addEventListener('click', function () {
    var amt = Number($('amt').value);
    var btn = this;
    if (!amt || amt < 1) { $('upErr').textContent = 'Enter a valid amount (min \u20b91).'; return; }
    btn.disabled = true;
    $('upErr').textContent = '';
    api('/credits/create-order', { method: 'POST', body: { amount: amt } }).then(function (r) {
      if (!r.success || !r.data || !r.data.order || !r.data.key) {
        btn.disabled = false;
        $('upErr').textContent = msg(r);
        return;
      }
      var o = r.data.order;
      var amountPaise = Number(o.amount || amt * 100);
      function openCheckout() {
        var rz = new window.Razorpay({
          key: r.data.key,
          amount: amountPaise,
          currency: 'INR',
          name: 'Grit&Gigs',
          description: 'Wallet top-up',
          order_id: o.id,
          handler: verify,
          prefill: { contact: '', name: '' },
          theme: { color: '#6C3FE8' },
          modal: { ondismiss: function () { btn.disabled = false; location.reload(); } }
        });
        rz.on('payment.failed', function () { $('upErr').textContent = 'Payment failed or cancelled.'; });
        rz.open();
      }
      if (typeof window.Razorpay === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://checkout.razorpay.com/v1/checkout.js';
        s.onload = openCheckout;
        s.onerror = function () { btn.disabled = false; $('upErr').textContent = 'Could not load payment gateway.'; };
        document.head.appendChild(s);
      } else {
        openCheckout();
      }
    }).catch(function () {
      btn.disabled = false;
      $('upErr').textContent = 'Cannot reach server.';
    });
  });

  load();
})();
</script></script>
