<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(!localStorage.getItem('se_token')){location.replace('/');}}catch(e){}</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Inbox — Grit&Gigs</title>
<link rel="icon" href="/favicon.ico?v=8"/><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8"/><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=8"/><link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=8"/><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"/>
<link rel="stylesheet" href="/assets/feed.css?v=36"/>
<style>
.readall{display:inline-flex;align-items:center;gap:6px;border:1px solid #e4e2ee;background:#fff;color:#4b5563;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease;}
.readall:hover{background:#6C3FE8;border-color:#6C3FE8;color:#fff;box-shadow:0 4px 12px rgba(108,63,232,.28);transform:translateY(-1px);}
.readall:active{transform:translateY(0);box-shadow:none;}
.readall:focus-visible{outline:2px solid #6C3FE8;outline-offset:2px;}
.readall.busy{opacity:.7;pointer-events:none;}
.readall svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header class="topnav">
  <a class="nav-logo" href="/circle" title="Grit&Gigs home"><div class="nav-logo-mark"><img src="/logo.svg" alt="" width="32" height="32"></div><span class="nav-logo-text"><span class="logo-text-black">Grit</span><span class="logo-text-blue">&amp;Gigs</span></span></a>
  <div class="searchwrap">
      <div class="searchbox"><input id="navSearch" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="navSearchDrop" aria-autocomplete="list" placeholder="Search gigs, projects, barter…"/></div>
      <div class="searchdrop" id="navSearchDrop" role="listbox" aria-label="Search suggestions"></div>
    </div>
  <div class="icons">
    <a href="/circle" title="Feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg></a>
    <a href="/jobs" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.3 16.3 4.2 4.2"/></svg></a>
    <a class="badge" href="/messages.html" title="Messages"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="cnt" id="msgBadge" style="display:none;">0</span></a>
    <a href="/notifications.html" class="badge on" title="Inbox"><svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5A4.7 4.7 0 0 1 19 13Z"/></svg><span class="cnt" id="notifBadge" style="display:none;">0</span></a>
    <a href="/orders.html" title="Orders"><svg viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2Z"/><path d="M3.3 8.3 12 13.3l8.7-5"/><path d="M12 13.3V21"/></svg></a>
    <a href="/profile.html" id="navProfile" title="Profile"><img id="navAv" class="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/></a>
  </div>
</header>

<div class="wrap">
  <main style="width:100%;max-width:600px;">
    <div class="side-card" style="display:flex;align-items:center;justify-content:space-between;">
      <h4 style="margin:0;">Activity</h4>
      <button class="readall" id="readAll" type="button" style="display:none;" title="Mark all notifications as read"><svg viewBox="0 0 24 24"><path d="M2 13l4 4L14 8"/><path d="M11 15l2 2L22 7"/></svg><span>Mark all read</span></button>
    </div>
    <div id="ntfList"></div>
  </main>
</div>

<!-- login modal -->
<div class="modal-backdrop" id="loginModal">
  <div class="modal">
    <h3>Sign in</h3>
    <div class="fld"><label>Email</label><input type="email" id="loginEmail" placeholder="you@email.com"/></div>
    <div class="fld"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••"/></div>
    <div class="err" id="loginErr"></div>
    <div class="actions"><button class="primary" id="loginSubmit">Sign in</button></div>
    <div class="note">No account? <a href="#" id="gotoRegister">Create one here</a></div>
  </div>
</div>

<div class="modal-backdrop" id="registerModal">
  <div class="modal">
    <h3>Create your Grit&amp;Gigs account</h3>
    <div class="fld-row">
      <div class="fld"><label>First name</label><input type="text" id="regFirst" placeholder="Arjun"/></div>
      <div class="fld"><label>Last name</label><input type="text" id="regLast" placeholder="Kumar"/></div>
    </div>
    <div class="fld"><label>Email</label><input type="email" id="regEmail" placeholder="you@email.com"/></div>
    <div class="fld"><label>Phone (WhatsApp)</label><input type="tel" id="regPhone" placeholder="+91 98765 43210"/></div>
    <div class="fld"><label>Password (8+ chars)</label><input type="password" id="regPass" placeholder="••••••••"/></div>
    <div class="err" id="regErr"></div>
    <div class="actions">
      <button class="ghost" id="regCancel">Cancel</button>
      <button class="primary" id="regSubmit">Create account</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="verifyModal">
  <div class="modal">
    <h3>Verify your email</h3>
    <p class="note" id="verifyEmail"></p>
    <div class="fld"><label>6-digit code</label><input type="text" id="verifyOtp" maxlength="6" placeholder="123456"/></div>
    <div class="err" id="verifyErr"></div>
    <div class="actions">
      <button class="ghost" id="verifyCancel">Cancel</button>
      <button class="primary" id="verifySubmit">Verify</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="postModal" style="overflow-y:auto;">
  <div class="modal" style="max-width:900px;"></div>
</div>

<script src="/socket.io/socket.io.js"></script> <script src="/assets/onboarding.js?v=2"></script> <script src="/assets/feed-app.js?v=39"></script>
<script>
(function () {
  var c = window.community;
  function $(x) { return document.getElementById(x); }

  window.onAuthed = function () { init(); };
  function init() {
    var me = c.me();
    if (!me || !me.id) return;
    var p = $('navProfile'); if (p) p.href = '/profile.html?id=' + encodeURIComponent(me.id);
    var av = $('navAv'); if (av) av.src = c.avatarFor(me);
  }
  var me0 = c.me();
  if (me0 && me0.id) { var av = $('navAv'); if (av) av.src = c.avatarFor(me0); var pp = $('navProfile'); if (pp) pp.href = '/profile.html?id=' + encodeURIComponent(me0.id); }

  if ($('gotoRegister')) $('gotoRegister').addEventListener('click', function (e) { e.preventDefault(); c.openRegister(); });
  if ($('regCancel')) $('regCancel').addEventListener('click', function () { $('registerModal').classList.remove('open'); });
  if ($('verifyCancel')) $('verifyCancel').addEventListener('click', function () { $('verifyModal').classList.remove('open'); });
  if ($('loginModal')) $('loginModal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
  if ($('registerModal')) $('registerModal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });

  var navSearch = $('navSearch');
  navSearch.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && navSearch.value.trim()) location.href = '/jobs?q=' + encodeURIComponent(navSearch.value.trim());
  });

  var list = $('ntfList');
  var svg = function (paths, extra) {
    return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '>' + paths + '</svg>';
  };
  var ICO_HEART = svg('<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.9 8.8-8.9a5.5 5.5 0 0 0 0-7.8z"/>');
  var ICO_CHAT = svg('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l2-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>');
  var ICO_USERPLUS = svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>');
  var ICO_SWAP = svg('<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>');
  var ICO_BRIEFCASE = svg('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>');
  var ICO_STAR = svg('<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3"/>');
  var ICO_BELL = svg('<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>');
  var ico = {
    COMMUNITY_LIKE: ICO_HEART,
    COMMUNITY_COMMENT: ICO_CHAT,
    COMMUNITY_FOLLOW: ICO_USERPLUS,
    COMMUNITY_ORDER: ICO_SWAP,
    COMMUNITY_ORDER_ACCEPTED: ICO_SWAP,
    COMMUNITY_ORDER_DELIVERED: ICO_SWAP,
    COMMUNITY_ORDER_COMPLETED: ICO_SWAP,
    COMMUNITY_ORDER_REVISION: ICO_SWAP,
    COMMUNITY_ORDER_CANCELLED: ICO_SWAP,
    REVIEW_RECEIVED: ICO_STAR,
    JOB_APPLICATION: ICO_BRIEFCASE,
    JOB_APPLICATION_UPDATE: ICO_BRIEFCASE,
    OTHER: ICO_BELL,
  };
  function load() {
    if (!c.token()) { list.innerHTML = '<div class="empty"><h3>Sign in to see activity</h3><button class="pbtn" id="here">Sign in</button></div>'; var h = $('here'); if (h) h.addEventListener('click', function () { c.openLogin(); }); return; }
    list.innerHTML = '<div class="loading">Loading…</div>';
    c.api('/community/notifications?limit=40').then(function (r) {
      if (!r.ok) { list.innerHTML = '<div class="empty"><h3>Could not load</h3></div>'; return; }
      var d = r.d.data;
      var items = d.notifications || [];
      $('readAll').style.display = items.length ? '' : 'none';
      if (!items.length) { list.innerHTML = '<div class="empty"><h3>Nothing yet.</h3><p>Likes, comments, follows, job applications and orders will show here.</p></div>'; return; }
      list.innerHTML = '';
      items.forEach(function (n) {
        var el = document.createElement('div');
        el.className = 'ntf' + (n.isRead ? '' : ' unread');
        var target = n.linkUrl || '#';
        var icon = ico[n.type] || ico.OTHER;
        el.innerHTML = '<span class="ico">' + icon + '</span>' +
          '<div class="tx"><b>' + c.esc(n.title) + '</b><br/>' + c.esc(n.message) + '<div class="ago">' + c.timeAgo(n.createdAt) + '</div></div>';
        if (n.linkUrl && n.linkUrl !== '#') {
          el.style.cursor = 'pointer';
          el.addEventListener('click', function () { location.href = n.linkUrl; });
        }
        list.appendChild(el);
      });
      // mark read
      if (d.unread > 0) { c.api('/community/notifications/read', { method: 'POST' }); }
    }).catch(function () { list.innerHTML = '<div class="empty"><h3>Network error</h3></div>'; });
  }

  $('readAll').addEventListener('click', function () {
    var btn = $('readAll');
    if (btn.classList.contains('busy')) return;
    var lbl = btn.querySelector('span');
    btn.classList.add('busy');
    btn.disabled = true;
    lbl.textContent = 'Marking…';
    c.api('/community/notifications/read', { method: 'POST' }).then(function (r) {
      btn.classList.remove('busy');
      btn.disabled = false;
      lbl.textContent = 'Mark all read';
      if (!r.ok) { c.toast(r.d.message || 'Could not mark as read', true); return; }
      list.querySelectorAll('.ntf').forEach(function (x) { x.classList.remove('unread'); });
      btn.style.display = 'none';
      var bx = $('notifBadge'); if (bx) bx.style.display = 'none';
      c.toast('All caught up');
    }).catch(function () {
      btn.classList.remove('busy');
      btn.disabled = false;
      lbl.textContent = 'Mark all read';
      c.toast('Network error', true);
    });
  });

  load();
})();
</script>
</body>
</html>
