<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Messages — Grit&Gigs</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=6"/>
<link rel="stylesheet" href="/assets/feed.css?v=6"/>
<style>
  .msg-wrap{display:flex;height:calc(100vh - 62px);gap:16px;align-items:stretch;}
  .msg-list{width:340px;flex:0 0 340px;background:#fff;border:1px solid var(--line,#eee);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
  .msg-list .head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line,#eee);}
  .msg-list .head h2{font-size:17px;margin:0;}
  .msg-list .tabs{display:flex;padding:8px 14px 0;gap:6px;}
  .msg-list .tabs button{flex:1;border:none;background:none;font-weight:600;font-size:13px;padding:8px 0;color:var(--dusk,#6b7280);border-bottom:2px solid transparent;cursor:pointer;}
  .msg-list .tabs button.on{color:var(--ink,#111);border-bottom-color:var(--blue,#5599ff);}
  .msg-list .search{padding:10px 14px;}
  .msg-list .search input{width:100%;border:1px solid var(--line,#eee);background:#fafafa;border-radius:10px;padding:8px 12px;font-size:13px;outline:none;}
  .convs{flex:1;overflow-y:auto;}
  .conv{display:flex;gap:10px;padding:10px 14px;cursor:pointer;align-items:center;}
  .conv:hover{background:#fafafa;}
  .conv.on{background:#eef5ff;}
  .conv .av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 46px;background:var(--line,#eee);}
  .conv .cv{flex:1;min-width:0;}
  .conv .cv .cname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv .cv .clast{font-size:12px;color:var(--dusk,#6b7280);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv .cmeta{flex:0 0 auto;text-align:right;font-size:11px;color:var(--dusk,#6b7280);display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
  .conv .badge{background:var(--blue,#5599ff);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;}
  .msg-main{flex:1;background:#fff;border:1px solid var(--line,#eee);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
  .msg-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dusk,#6b7280);gap:8px;}
  .msg-empty b{color:var(--ink,#111);}
  .mhead{padding:12px 16px;border-bottom:1px solid var(--line,#eee);display:flex;align-items:center;gap:10px;}
  .mhead .av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--line,#eee);}
  .mhead .t{min-width:0;}
  .mhead .t .nm{font-weight:600;font-size:14px;}
  .mhead .t .sub{font-size:12px;color:var(--dusk,#6b7280);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mhead .acts{margin-left:auto;display:flex;gap:8px;}
  .mhead .acts button{background:#fafafa;border:1px solid var(--line,#eee);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;}
  .thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .msg{max-width:72%;display:flex;flex-direction:column;gap:2px;}
  .msg.mine{align-self:flex-end;align-items:flex-end;}
  .msg .bubble{background:#f1f3f5;color:var(--ink,#111);border-radius:16px;padding:8px 12px;font-size:13.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;}
  .msg.mine .bubble{background:var(--blue,#5599ff);color:#fff;}
  .msg .mt{font-size:10.5px;color:var(--dusk,#6b7280);padding:0 4px;}
  .msg .att img{max-width:220px;border-radius:10px;display:block;}
  .msg .att a{color:var(--blue,#5599ff);font-size:12px;word-break:break-all;}
  .composer{border-top:1px solid var(--line,#eee);padding:10px 14px;display:flex;gap:8px;align-items:flex-end;}
  .composer textarea{flex:1;border:1px solid var(--line,#eee);border-radius:12px;padding:9px 12px;font-size:13.5px;resize:none;min-height:40px;max-height:120px;outline:none;font-family:inherit;}
  .composer button.send{background:var(--blue,#5599ff);color:#fff;border:none;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:13.5px;}
  .composer button.send:disabled{opacity:.5;}
  .composer label.att{background:#fafafa;border:1px solid var(--line,#eee);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--dusk,#6b7280);}
  .grp-cards{display:flex;flex-direction:column;gap:10px;padding:12px;overflow-y:auto;flex:1;}
  .grp{border:1px solid var(--line,#eee);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;}
  .grp .gi{width:42px;height:42px;border-radius:12px;background:#f0e9ff;color:#6C3FE8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 42px;}
  .grp .gn{flex:1;min-width:0;}
  .grp .gn b{font-size:13.5px;}
  .grp .gn div{font-size:12px;color:var(--dusk,#6b7280);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .grp button{border:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer;flex:0 0 auto;}
  .grp button.join{background:var(--blue,#5599ff);color:#fff;}
  .grp button.open{background:#fafafa;color:var(--ink,#111);border:1px solid var(--line,#eee);}
  .grp button.in{background:#eaf6ec;color:#1a7f37;}
  .members{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .members .m{display:flex;align-items:center;gap:6px;background:#fafafa;border:1px solid var(--line,#eee);border-radius:999px;padding:4px 10px 4px 4px;font-size:12px;}
  .members .m img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--line,#eee);}
  .share-bar{background:#f0f7ff;border-bottom:1px solid #d7e8ff;padding:10px 16px;font-size:13px;display:flex;gap:10px;align-items:center;}
  .share-bar b{font-size:13px;}
  .share-bar .x{margin-left:auto;cursor:pointer;font-weight:800;color:var(--dusk,#6b7280);border:none;background:none;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="topnav">
  <a class="brand" href="/feed"><img src="/logo.svg?v=3" alt="" class="brand-mark"/><span>Grit<span>&amp;Gigs</span></span></a>
  <div class="icons">
    <a href="/feed" title="Feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg></a>
    <a href="/explore.html" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.3 16.3 4.2 4.2"/></svg></a>
    <a href="/messages.html" title="Messages" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="cnt" id="msgBadge" style="display:none;">0</span></a>
    <a href="/notifications.html" class="badge" title="Inbox"><svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5A4.7 4.7 0 0 1 19 13Z"/></svg><span class="cnt" id="notifBadge" style="display:none;">0</span></a>
    <a href="/orders.html" title="Orders"><svg viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2Z"/><path d="M3.3 8.3 12 13.3l8.7-5"/><path d="M12 13.3V21"/></svg></a>
    <a href="/profile.html" title="Profile"><img id="navAv" class="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/></a>
  </div>
</div>

<div class="wrap">
  <div class="msg-wrap">
    <div class="msg-list">
      <div class="head">
        <h2>Messages</h2>
        <button class="primary" id="newChat" style="padding:6px 12px;font-size:12px;">+ New</button>
      </div>
      <div class="tabs">
        <button id="tabChats" class="on">Chats</button>
        <button id="tabGroups">Groups</button>
      </div>
      <div class="search"><input id="convSearch" placeholder="Search chats…"/></div>
      <div id="convList" class="convs"></div>
      <div id="groupPane" class="grp-cards" style="display:none;"></div>
    </div>

    <div class="msg-main">
      <div class="share-bar" id="shareBar" style="display:none;"></div>
      <div class="mhead" id="mhead" style="display:none;"></div>
      <div class="msg-empty" id="msgEmpty">
        <div style="font-size:34px;">✉️</div>
        <b>Pick a chat</b>
        <div>Messages, offers and group chats live here.</div>
      </div>
      <div class="thread" id="thread" style="display:none;"></div>
      <div class="composer" id="composer" style="display:none;">
        <label class="att" for="attFile" title="Attach a file">+</label>
        <input type="file" id="attFile" style="display:none;" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf"/>
        <textarea id="msgBox" rows="1" placeholder="Message…"></textarea>
        <button class="send" id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- new chat modal -->
<div class="modal-backdrop" id="newChatModal">
  <div class="modal">
    <h3>New chat</h3>
    <div class="sub">Paste a member's profile id (from their profile link: gritandgigs.in/profile.html?id=…)</div>
    <div class="fld"><label>Profile id</label><input type="text" id="newChatId" placeholder="Paste profile id…"/></div>
    <div class="err" id="newChatErr"></div>
    <div class="actions">
      <button class="ghost" id="newChatCancel">Cancel</button>
      <button class="primary" id="newChatOk">Continue</button>
    </div>
  </div>
</div>

<!-- create group modal -->
<div class="modal-backdrop" id="groupModal">
  <div class="modal">
    <h3>New group</h3>
    <div class="fld"><label>Group name</label><input type="text" id="groupName" placeholder="Logo designers of India"/></div>
    <div class="fld"><label>What's it about (optional)</label><input type="text" id="groupDesc" placeholder="Share work, referrals and tips"/></div>
    <div class="err" id="groupErr"></div>
    <div class="actions">
      <button class="ghost" id="groupCancel">Cancel</button>
      <button class="primary" id="groupOk">Create group</button>
    </div>
  </div>
</div>

<!-- group detail modal -->
<div class="modal-backdrop" id="groupDetailModal">
  <div class="modal">
    <h3 id="gdName"></h3>
    <div class="sub" id="gdDesc"></div>
    <div class="members" id="gdMembers"></div>
    <div class="fld" id="gdInviteWrap" style="display:none;margin-top:12px;">
      <label>Invite member (paste profile id)</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="gdInviteId" placeholder="Paste profile id to invite…" style="flex:1;"/>
        <button class="primary" id="gdInviteOk">Invite</button>
      </div>
    </div>
    <div class="err" id="gdErr"></div>
    <div class="actions"><button class="ghost" id="gdClose">Close</button></div>
  </div>
</div>

<!-- send-to (share) modal -->
<div class="modal-backdrop" id="shareModal">
  <div class="modal" style="max-width:460px;">
    <h3>Send to…</h3>
    <div class="sub" id="sharePreview"></div>
    <div style="max-height:260px;overflow-y:auto;" id="shareTargets"></div>
    <div class="fld" style="margin-top:10px;">
      <label>Add a note (optional)</label>
      <input type="text" id="shareNote" placeholder="Saw this and thought of you…"/>
    </div>
    <div class="err" id="shareErr"></div>
    <div class="actions"><button class="ghost" id="shareCancel">Cancel</button></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/assets/feed-app.js?v=5"></script>
<script src="/assets/messages.js?v=5"></script>
</body>
</html>
