<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(!localStorage.getItem('se_token')){location.replace('/');}}catch(e){}</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Messages — Grit&Gigs</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=6"/>
<link rel="stylesheet" href="/assets/feed.css?v=14"/>
<style>
  .wrap{display:block;padding:76px 0 0;}
  .msg-wrap{display:flex;height:calc(100vh - 76px);align-items:stretch;background:#fff;}
  .msg-list{width:min(400px,40vw);min-width:300px;flex:0 0 auto;background:#fff;border-right:1px solid #ededf2;display:flex;flex-direction:column;overflow:hidden;}
  .msg-list .head{padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between;}
  .msg-list .head h2{font-size:20px;font-weight:700;margin:0;color:#1a1a2e;}
  .msg-list .head button.primary{background:#6C3FE8;color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .msg-list .head button.primary:hover{background:#5a34c6;}
  .msg-list .tabs{display:flex;padding:2px 20px 10px;gap:20px;border-bottom:1px solid #f0f0f5;}
  .msg-list .tabs button{flex:none;border:none;background:none;font-weight:600;font-size:13.5px;padding:4px 0;color:#8a8ea3;border-bottom:2px solid transparent;cursor:pointer;}
  .msg-list .tabs button.on{color:#1a1a2e;border-bottom-color:#6C3FE8;}
  .msg-list .search{padding:12px 20px 6px;}
  .msg-list .search input{width:100%;border:1px solid transparent;background:#f2f2f7;border-radius:20px;padding:9px 16px;font-size:13.5px;outline:none;transition:.15s;box-sizing:border-box;}
  .msg-list .search input:focus{border-color:#e6e3f5;background:#fff;}
  .convs{flex:1;overflow-y:auto;padding:4px 0;}
  .conv{display:flex;gap:12px;padding:10px 20px;cursor:pointer;align-items:center;margin:0;}
  .conv:hover{background:#fafafa;}
  .conv.on{background:#f4f2fb;}
  .conv .av{width:50px;height:50px;border-radius:50%;object-fit:cover;flex:0 0 50px;background:#f0eef7;}
  .conv .cv{flex:1;min-width:0;}
  .conv .cv .cname{font-weight:600;font-size:14px;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv .cv .clast{font-size:12.5px;color:#9a9db0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .conv .cmeta{flex:0 0 auto;text-align:right;font-size:11px;color:#b5b8c8;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .conv .badge{background:#6C3FE8;color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-weight:700;}
  .msg-main{flex:1;min-width:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;}
  .msg-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9a9db0;gap:10px;}
  .msg-empty b{color:#1a1a2e;}
  .mhead{flex:0 0 auto;padding:12px 20px;border-bottom:1px solid #ededf2;display:flex;align-items:center;gap:10px;background:#fff;}
  .mhead .av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#f0eef7;}
  .mhead .t{min-width:0;}
  .mhead .t .nm{font-weight:700;font-size:15px;color:#1a1a2e;}
  .mhead .t .sub{font-size:12px;color:#9a9db0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mhead .back{background:none;border:none;font-size:20px;font-weight:700;color:#1a1a2e;cursor:pointer;padding:0 4px 0 0;line-height:1;}
  .mhead .acts{margin-left:auto;display:flex;gap:4px;align-items:center;}
  .mhead .acts button{background:none;border:none;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#6C3FE8;cursor:pointer;}
  .mhead .acts button:hover{background:#f4f2fb;}
  .thread{flex:1;overflow-y:auto;padding:20px 22px 10px;display:flex;flex-direction:column;gap:4px;}
  .msg{max-width:70%;display:flex;flex-direction:column;gap:3px;}
  .msg.mine{align-self:flex-end;align-items:flex-end;}
  .msg .bubble{background:#f1f3f5;color:#1a1a2e;border-radius:20px;border-top-left-radius:6px;padding:9px 14px;font-size:13.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;}
  .msg.mine .bubble{background:#6C3FE8;color:#fff;border-radius:20px;border-top-right-radius:6px;}
  .msg .mt{font-size:10.5px;color:#b5b8c8;padding:0 6px;}
  .msg .att img{max-width:260px;border-radius:16px;display:block;margin-top:4px;}
  .msg .att a{color:#6C3FE8;font-size:12px;word-break:break-all;}
  .composer{flex:0 0 auto;border-top:1px solid #ededf2;padding:12px 20px;display:flex;gap:8px;align-items:flex-end;background:#fff;}
  .composer label.att{width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#6C3FE8;border-radius:50%;flex:0 0 auto;}
  .composer label.att:hover{background:#f4f2fb;}
  .composer textarea{flex:1;border:1px solid transparent;background:#f2f2f7;border-radius:22px;padding:10px 18px;font-size:14px;resize:none;min-height:38px;max-height:120px;outline:none;font-family:inherit;box-sizing:border-box;}
  .composer textarea:focus{border-color:#e6e3f5;background:#fff;}
  .composer button.send{background:#6C3FE8;color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-weight:700;cursor:pointer;font-size:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .composer button.send:hover{background:#5a34c6;}
  .composer button.send:disabled{opacity:.45;cursor:default;}
  .grp-cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  #grpNew{margin:12px 20px;background:#f4f2fb;color:#6C3FE8;border:none;border-radius:20px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;flex:0 0 auto;}
  .grp{border-bottom:1px solid #f2f2f7;padding:12px 20px;display:flex;gap:12px;align-items:center;}
  .grp:hover{background:#fafafa;}
  .grp .gi{width:44px;height:44px;border-radius:14px;background:#f0e9ff;color:#6C3FE8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:0 0 44px;}
  .grp .gn{flex:1;min-width:0;}
  .grp .gn b{font-size:14px;color:#1a1a2e;}
  .grp .gn div{font-size:12.5px;color:#9a9db0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .grp button{border:none;border-radius:20px;padding:7px 14px;font-weight:600;font-size:12.5px;cursor:pointer;flex:0 0 auto;}
  .grp button.join{background:#6C3FE8;color:#fff;}
  .grp button.join:hover{background:#5a34c6;}
  .grp button.open{background:#f2f2f7;color:#1a1a2e;}
  .grp button.in{background:#e5f5ec;color:#1a7f37;}
  .members{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .members .m{display:flex;align-items:center;gap:6px;background:#fafafa;border:1px solid #f0f0f5;border-radius:999px;padding:4px 10px 4px 4px;font-size:12px;}
  .members .m img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#f0eef7;}
  .share-bar{background:#faf6ff;border-bottom:1px solid #f0ebff;padding:10px 20px;font-size:13px;display:flex;gap:10px;align-items:center;color:#6C3FE8;}
  .share-bar b{font-size:13px;}
  .share-bar .x{margin-left:auto;cursor:pointer;font-weight:800;color:#8a8ea3;border:none;background:none;}
  .back{display:none;align-items:center;justify-content:center;}
  @media (max-width:820px){
    .wrap{padding:76px 0 0;}
    .msg-wrap{height:calc(100vh - 76px);}
    .msg-list{width:100%;min-width:0;border-right:none;}
    body.msg-open .msg-list{display:none;}
    body.msg-open .msg-main{width:100%;}
    .back{display:inline-flex;}
    .composer{padding:10px 12px;}
    .thread{padding:14px 12px 8px;}
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="topnav">
  <a class="nav-logo" href="/feed" title="Grit&Gigs home"><div class="nav-logo-mark"><span class="logo-g-black">G</span><span class="logo-g-blue">&amp;G</span></div><span class="nav-logo-text"><span class="logo-text-black">Grit</span><span class="logo-text-blue">&amp;Gigs</span></span></a>
  <div class="icons">
    <a href="/feed" title="Feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg></a>
    <a href="/explore.html" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.3 16.3 4.2 4.2"/></svg></a>
    <a href="/messages.html" title="Messages" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="cnt" id="msgBadge" style="display:none;">0</span></a>
    <a href="/notifications.html" class="badge" title="Inbox"><svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5A4.7 4.7 0 0 1 19 13Z"/></svg><span class="cnt" id="notifBadge" style="display:none;">0</span></a>
    <a href="/orders.html" title="Orders"><svg viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2Z"/><path d="M3.3 8.3 12 13.3l8.7-5"/><path d="M12 13.3V21"/></svg></a>
    <a href="/profile.html" id="navProfile" title="Profile"><img id="navAv" class="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/></a>
  </div>
</div>

<div class="wrap">
  <div class="msg-wrap">
    <div class="msg-list">
      <div class="head">
        <h2>Messages</h2>
        <button class="primary" id="newChat">＋ New</button>
      </div>
      <div class="tabs">
        <button id="tabChats" class="on">Chats</button>
        <button id="tabGroups">Groups</button>
      </div>
      <div class="search"><input id="convSearch" placeholder="Search chats…"/></div>
      <div id="convList" class="convs"></div>
      <div id="groupPane" class="grp-cards" style="display:none;"></div>
    </div>

    <div class="msg-main">
      <div class="share-bar" id="shareBar" style="display:none;"></div>
      <div class="mhead" id="mhead" style="display:none;"></div>
      <div class="msg-empty" id="msgEmpty">
        <div style="font-size:34px;">✉️</div>
        <b>Pick a chat</b>
        <div>Messages, offers and group chats live here.</div>
      </div>
      <div class="thread" id="thread" style="display:none;"></div>
      <div class="composer" id="composer" style="display:none;">
        <label class="att" for="attFile" title="Attach a file">+</label>
        <input type="file" id="attFile" style="display:none;" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf"/>
        <textarea id="msgBox" rows="1" placeholder="Message…"></textarea>
        <button class="send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg></button>
      </div>
    </div>
  </div>
</div>

<!-- new chat modal -->
<div class="modal-backdrop" id="newChatModal">
  <div class="modal">
    <h3>New chat</h3>
    <div class="sub">Paste a member's profile id (from their profile link: gritandgigs.in/profile.html?id=…)</div>
    <div class="fld"><label>Profile id</label><input type="text" id="newChatId" placeholder="Paste profile id…"/></div>
    <div class="err" id="newChatErr"></div>
    <div class="actions">
      <button class="ghost" id="newChatCancel">Cancel</button>
      <button class="primary" id="newChatOk">Continue</button>
    </div>
  </div>
</div>

<!-- create group modal -->
<div class="modal-backdrop" id="groupModal">
  <div class="modal">
    <h3>New group</h3>
    <div class="fld"><label>Group name</label><input type="text" id="groupName" placeholder="Logo designers of India"/></div>
    <div class="fld"><label>What's it about (optional)</label><input type="text" id="groupDesc" placeholder="Share work, referrals and tips"/></div>
    <div class="err" id="groupErr"></div>
    <div class="actions">
      <button class="ghost" id="groupCancel">Cancel</button>
      <button class="primary" id="groupOk">Create group</button>
    </div>
  </div>
</div>

<!-- group detail modal -->
<div class="modal-backdrop" id="groupDetailModal">
  <div class="modal">
    <h3 id="gdName"></h3>
    <div class="sub" id="gdDesc"></div>
    <div class="members" id="gdMembers"></div>
    <div class="fld" id="gdInviteWrap" style="display:none;margin-top:12px;">
      <label>Invite member (paste profile id)</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="gdInviteId" placeholder="Paste profile id to invite…" style="flex:1;"/>
        <button class="primary" id="gdInviteOk">Invite</button>
      </div>
    </div>
    <div class="err" id="gdErr"></div>
    <div class="actions"><button class="ghost" id="gdClose">Close</button></div>
  </div>
</div>

<!-- send-to (share) modal -->
<div class="modal-backdrop" id="shareModal">
  <div class="modal" style="max-width:460px;">
    <h3>Send to…</h3>
    <div class="sub" id="sharePreview"></div>
    <div style="max-height:260px;overflow-y:auto;" id="shareTargets"></div>
    <div class="fld" style="margin-top:10px;">
      <label>Add a note (optional)</label>
      <input type="text" id="shareNote" placeholder="Saw this and thought of you…"/>
    </div>
    <div class="err" id="shareErr"></div>
    <div class="actions"><button class="ghost" id="shareCancel">Cancel</button></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/assets/onboarding.js?v=1"></script> <script src="/assets/feed-app.js?v=14"></script>
<script src="/assets/messages.js?v=6"></script>
</body>
</html>
