<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico?v=10"/><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=10"/><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=10"/><link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=10"/><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4"/>
<meta charset="UTF-8"><title>Signing in...</title>
<style>body{background:#0A0A0F;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:system-ui,sans-serif}.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.15);border-top-color:var(--violet,#6C3FE8);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:rgba(255,255,255,0.6);margin-top:16px}</style>
</head>
<body>
<div style="text-align:center"><div class="spinner"></div><p>Completing sign-in...</p></div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var accessToken = params.get('accessToken');
  var refreshToken = params.get('refreshToken');
  var userRaw = params.get('user');
  var error = params.get('error');

  if (error) {
    document.body.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.style.textAlign = 'center';
    var p = document.createElement('p');
    p.style.color = '#ef4444';
    p.textContent = 'Sign-in failed: ' + error;
    var retry = document.createElement('a');
    retry.href = '/?login=1';
    retry.textContent = 'Try again';
    retry.style.cssText = 'display:inline-block;margin-top:12px;padding:8px 20px;background:var(--violet,#6C3FE8);color:#fff;border-radius:6px;text-decoration:none;';
    wrap.appendChild(p);
    wrap.appendChild(retry);
    document.body.appendChild(wrap);
    return;
  }

  if (accessToken && refreshToken && userRaw) {
    var user = null;
    try {
      user = JSON.parse(userRaw);
    } catch (e1) {
      // Older links double-encoded the payload — decode once more.
      try { user = JSON.parse(decodeURIComponent(userRaw)); }
      catch (e2) { user = null; }
    }
    if (user) {
      localStorage.setItem('se_token', accessToken);
      localStorage.setItem('se_refresh', refreshToken);
      localStorage.setItem('se_user', JSON.stringify(user));
      window.location.href = '/feed';
    } else {
      document.body.textContent = 'Error processing sign-in';
    }
  } else {
    // Try closing window — might be a popup
    if (window.opener) { window.close(); }
    else { document.body.textContent = 'No credentials received. Please try again.'; }
  }
})();
</script>
</body>
</html>
