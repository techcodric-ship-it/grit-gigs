<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Redirecting… · Grit&amp;Gigs</title>
<script>
(function () {
  var to = null;
  var path = location.pathname;
  var hash = (location.hash || "").toLowerCase();
  var q = new URLSearchParams(location.search);
  var tab = (q.get("tab") || "").toLowerCase();
  if (path.indexOf("/dashboard/orders") === 0) {
    to = "/orders.html";
  } else if (hash === "#inbox") {
    to = "/messages.html";
  } else if (hash === "#grit-circle") {
    to = "/messages.html";
  } else if (hash === "#my-exchanges") {
    to = "/orders.html?tab=exchanges";
  } else if (hash === "#squad-orders") {
    to = "/orders.html?tab=legacy";
  } else if (hash === "#my-projects") {
    to = "/orders.html?tab=projects";
  } else if (hash === "#post-project") {
    to = "/feed";
  } else if (tab === "orders") {
    to = "/orders.html?tab=community";
  } else if (tab === "wallet" || tab === "transactions" || tab === "payments") {
    to = "/wallet.html";
  } else if (tab === "plan" || tab === "plans" || tab === "billing" || tab === "subscription") {
    to = "/buy-more.html";
  } else if (tab === "my-profile" || tab === "profile") {
    to = "/settings.html";
  } else if (tab === "refer" || tab === "referrals" || tab === "invites") {
    to = "/refer-and-earn.html";
  } else if (tab === "inbox" || tab === "messages" || tab === "grit-circle") {
    to = "/messages.html";
  } else if (tab === "browse-projects" || tab === "my-projects" || tab === "projects") {
    to = "/orders.html?tab=projects";
  } else if (tab === "my-exchanges" || tab === "exchanges" || tab === "barter") {
    to = "/orders.html?tab=exchanges";
  } else if (tab === "post-exchange") {
    to = "/feed";
  } else if (tab === "gigs" || tab === "my-gigs" || tab === "services") {
    to = "/explore?kind=GIG";
  } else if (tab === "") {
    to = "/feed" + location.search;
  } else {
    to = "/feed";
  }
  location.replace(to);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/feed"/></noscript>
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px;">Redirecting… <a href="/feed">Continue to the feed</a></p>
</body>
</html>
