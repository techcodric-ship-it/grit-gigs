<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(!localStorage.getItem('se_token')){location.replace('/');}}catch(e){}</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<title>Profile — Grit&Gigs</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=6"/>
<link rel="stylesheet" href="/assets/feed.css?v=14"/>
<style>
.pcard{background:#fff;border:1px solid #ececf0;border-radius:16px;margin-bottom:14px;overflow:hidden}
.pbanner{height:120px;background:linear-gradient(115deg,#111 0%,#2b2b33 55%,#eab308 175%)}
.phead{display:flex;gap:18px;padding:14px 22px 0;align-items:flex-end;flex-wrap:wrap;position:relative}
.pavatar{width:96px;height:96px;border-radius:50%;border:4px solid #fff;object-fit:cover;background:#f3f3f3;margin-top:-56px;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pheadmain{flex:1;min-width:220px;padding-bottom:4px}
.pnamerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pname{font-size:24px;font-weight:800;color:#17171a}
.vbadge{display:inline-flex;align-items:center;gap:5px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.vbadge svg{width:12px;height:12px}
.rbadge{font-size:11.5px;font-weight:700;padding:3.5px 10px;border-radius:99px;background:#111;color:#eab308}
.rbadge.mut{background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb}
.pmeta{font-size:13px;color:#6b7280;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.pactions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.pbtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d1d5db;color:#111827;font-weight:600;font-size:13px;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;line-height:1.3;text-decoration:none}
.pbtn:hover{background:#f9fafb;border-color:#9ca3af}
.pbtn.on{background:#2563eb;border-color:#2563eb;color:#fff}
.pbtn.on:hover{background:#1d4ed8;border-color:#1d4ed8}
.pbtn.view{background:#111;border-color:#111;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.pbtn.view:hover{background:#333;border-color:#333}
.pbtn.ghost{border-color:#d1d5db;color:#111827}
.pbtn.ghost:hover{background:#f9fafb;border-color:#9ca3af}
.pbtn svg{width:13px;height:13px;flex-shrink:0}
.pstats{display:flex;gap:18px;padding:14px 22px 0;flex-wrap:wrap;font-size:13px;color:#6b7280}
.pstats b{color:#17171a;font-size:15px;margin-right:4px}
.pbio{padding:12px 22px 18px;font-size:14.5px;color:#374151;white-space:pre-wrap;line-height:1.55}
.pctitle{margin:0;padding:16px 22px 2px;font-size:15px;color:#17171a}
.plabel{font-size:11px;letter-spacing:.1em;font-weight:800;color:#9ca3af;padding:12px 22px 0;text-transform:uppercase}
.plabel.mt{padding-top:16px}
.pempty{font-size:13px;color:#9ca3af;font-style:italic;padding:6px 22px 16px}
.pempty.n{padding-bottom:6px}
.workgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;padding:14px 22px 20px}
.workcard{border:1px solid #ececf0;border-radius:12px;overflow:hidden;background:#fafafa;display:flex;flex-direction:column}
.workcard img{width:100%;height:120px;object-fit:cover;background:#eee;display:block}
.workcard .wb{padding:10px 12px 12px}
.workcard .wb b{font-size:13.5px;display:block;margin-bottom:4px;color:#17171a}
.workcard .wb p{margin:0;font-size:12.5px;color:#6b7280;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.workcard .wb a{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:#1d4ed8;text-decoration:none}
.workcard .wb a:hover{text-decoration:underline}
.portlinks{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px 20px}
.portlinks a{display:inline-flex;align-items:center;gap:6px;border:1px solid #e5e7eb;background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:#374151;text-decoration:none;max-width:100%}
.portlinks a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.portlinks a:hover{border-color:#eab308;background:#fffbeb}
@media (max-width:640px){
.pbanner{height:88px}
.phead{padding:14px 14px 0;gap:12px}
.pavatar{width:76px;height:76px;margin-top:-48px}
.pstats,.pbio{padding-left:14px;padding-right:14px}
.pctitle{padding-left:14px;padding-right:14px}
.plabel{padding-left:14px}
.pempty{padding-left:14px;padding-right:14px}
.workgrid,.portlinks{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<header class="topnav">
  <a class="nav-logo" href="/feed" title="Grit&Gigs home"><div class="nav-logo-mark"><span class="logo-g-black">G</span><span class="logo-g-blue">&amp;G</span></div><span class="nav-logo-text"><span class="logo-text-black">Grit</span><span class="logo-text-blue">&amp;Gigs</span></span></a>
  <div class="searchbox"><input id="navSearch" placeholder="Search gigs, projects, barter…"/></div>
  <div class="icons">
    <a href="/feed" title="Feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg></a>
    <a href="/explore.html" title="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.3 16.3 4.2 4.2"/></svg></a>
    <a href="/messages.html" title="Messages"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><span class="cnt" id="msgBadge" style="display:none;">0</span></a>
    <a href="/notifications.html" class="badge" title="Inbox"><svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5A4.7 4.7 0 0 1 19 13Z"/></svg><span class="cnt" id="notifBadge" style="display:none;">0</span></a>
    <a href="/orders.html" title="Orders"><svg viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2Z"/><path d="M3.3 8.3 12 13.3l8.7-5"/><path d="M12 13.3V21"/></svg></a>
    <a href="/profile.html" id="navProfile" title="Profile" class="on"><img id="navAv" class="avatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/></a>
  </div>
</header>

<div class="wrap">
  <main style="width:100%;max-width:935px;">
    <div class="loading" id="loading">Loading profile…</div>

    <div id="profileBody" style="display:none;">
      <div class="pcard">
        <div class="pbanner"></div>
        <div class="phead">
          <img id="pAv" class="pavatar" src="https://api.dicebear.com/9.x/initials/svg?seed=grit&backgroundColor=f0f0f0&textColor=262626" alt=""/>
          <div class="pheadmain">
            <div class="pnamerow">
              <div class="pname" id="pName">Hustler</div>
              <span class="vbadge" id="pVerified" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m4 12.5 5.5 5.5L20 6.5"/></svg>Verified</span>
              <span class="rbadge" id="pSeek" style="display:none;"></span>
            </div>
            <div class="pmeta" id="pMeta"></div>
            <div class="pactions">
              <button class="pbtn" id="pBtn" style="display:none;">Follow</button>
              <button class="pbtn" id="pMsgBtn" style="display:none;">Message</button>
              <button class="pbtn view" id="pViewBtn" style="display:none;">View profile</button>
              <a class="pbtn ghost" id="pEditBtn" href="/settings.html" style="display:none;text-decoration:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>Edit profile</a>
            </div>
          </div>
        </div>
        <div class="pstats">
          <span><b id="pPosts">0</b>posts</span>
          <span><b id="pFollowers">0</b>followers</span>
          <span><b id="pLikes">0</b>likes</span>
        </div>
        <div class="pbio" id="pBio"></div>
      </div>

      <div class="pcard" id="pSkillsCard">
        <div class="pctitle">Skills</div>
        <div class="plabel n">Offers</div>
        <div class="skills" id="pSkills" style="padding:8px 22px 0;"></div>
        <div class="pempty n" id="pSkillsEmpty" style="display:none;">No skills listed yet.</div>
        <div class="plabel mt" id="pWantLabel" style="display:none;">Looking for</div>
        <div class="skills" id="pSkillsWant" style="padding:8px 22px 18px;"></div>
      </div>

      <div class="pcard" id="pWorkCard" style="display:none;">
        <div class="pctitle">Sample works</div>
        <div class="workgrid" id="pWorks"></div>
      </div>

      <div class="pcard" id="pPortCard" style="display:none;">
        <div class="pctitle">Portfolio &amp; links</div>
        <div class="portlinks" id="pLinks"></div>
      </div>

      <div class="prof-caption">
        <div class="on">POSTS</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
</div>

<!-- login modal -->
<div class="modal-backdrop" id="loginModal">
  <div class="modal">
    <h3>Sign in</h3>
    <div class="fld"><label>Email</label><input type="email" id="loginEmail" placeholder="you@email.com"/></div>
    <div class="fld"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••"/></div>
    <div class="err" id="loginErr"></div>
    <div class="actions"><button class="primary" id="loginSubmit">Sign in</button></div>
    <div class="note">No account? <a href="#" id="gotoRegister">Create one here</a></div>
  </div>
</div>

<div class="modal-backdrop" id="registerModal">
  <div class="modal">
    <h3>Create your Grit&amp;Gigs account</h3>
    <div class="fld-row">
      <div class="fld"><label>First name</label><input type="text" id="regFirst" placeholder="Arjun"/></div>
      <div class="fld"><label>Last name</label><input type="text" id="regLast" placeholder="Kumar"/></div>
    </div>
    <div class="fld"><label>Email</label><input type="email" id="regEmail" placeholder="you@email.com"/></div>
    <div class="fld"><label>Phone (WhatsApp)</label><input type="tel" id="regPhone" placeholder="+91 98765 43210"/></div>
    <div class="fld"><label>Password (8+ chars)</label><input type="password" id="regPass" placeholder="••••••••"/></div>
    <div class="err" id="regErr"></div>
    <div class="actions">
      <button class="ghost" id="regCancel">Cancel</button>
      <button class="primary" id="regSubmit">Create account</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="verifyModal">
  <div class="modal">
    <h3>Verify your email</h3>
    <p class="note" id="verifyEmail"></p>
    <div class="fld"><label>6-digit code</label><input type="text" id="verifyOtp" maxlength="6" placeholder="123456"/></div>
    <div class="err" id="verifyErr"></div>
    <div class="actions">
      <button class="ghost" id="verifyCancel">Cancel</button>
      <button class="primary" id="verifySubmit">Verify</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="postModal" style="overflow-y:auto;">
  <div class="modal" style="max-width:900px;"></div>
</div>

<script src="/assets/onboarding.js?v=1"></script> <script src="/assets/feed-app.js?v=15"></script>
<script>
(function () {
  var c = window.community;
  function $(x) { return document.getElementById(x); }
  var params = new URLSearchParams(location.search);
  var profId = params.get('id');

  function initNav(me) {
    if (!me || !me.id) return;
    var p = $('navProfile'); if (p) p.href = '/profile.html?id=' + encodeURIComponent(me.id);
    var av = $('navAv'); if (av) av.src = c.avatarFor(me);
    if (!profId) {
      profId = me.id;
      $('pBtn').style.display = 'none';
      loadProfile();
    }
  }
  window.onAuthed = function () { initNav(c.me()); };
  var me0 = c.me();
  if (me0 && me0.id) initNav(me0);

  if ($('gotoRegister')) $('gotoRegister').addEventListener('click', function (e) { e.preventDefault(); c.openRegister(); });
  if ($('regCancel')) $('regCancel').addEventListener('click', function () { $('registerModal').classList.remove('open'); });
  if ($('verifyCancel')) $('verifyCancel').addEventListener('click', function () { $('verifyModal').classList.remove('open'); });
  if ($('loginModal')) $('loginModal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
  if ($('registerModal')) $('registerModal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
  if ($('postModal')) $('postModal').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });

  var navSearch = $('navSearch');
  navSearch.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && navSearch.value.trim()) location.href = '/explore.html?q=' + encodeURIComponent(navSearch.value.trim());
  });

  var grid = $('grid');
  function tile(row) {
    var p = row.post;
    var med = c.primeMedia(row);
    var kind = c.kindCode(p.kind);
    var div = document.createElement('div');
    div.className = 'tile';
    var img;
    if (med && med.url) {
      var isReel = kind === 'REEL' || med.type === 'video';
      if (isReel) {
        div.classList.add('long');
        img = med.type === 'video'
          ? '<video src="' + c.esc(med.url) + '" muted loop playsinline preload="metadata"></video>'
          : '<img src="' + c.esc(med.url) + '" loading="lazy"/>';
      } else {
        img = '<img src="' + c.esc(med.url) + '" loading="lazy"/>';
      }
    } else {
      img = '<div style="position:absolute;inset:0;display:grid;place-items:center;background:#efefef;font-size:30px;">' + (kind === 'REEL' ? '▶' : '💬') + '</div>';
    }
    div.innerHTML = img + '<span class="kindtag">' + kind + '</span>' +
      (kind === 'REEL' || med.type === 'video' ? '<span class="reel-ic">▶</span>' : '') +
      '<div class="over"><span>♥ ' + Number(p.likeCount || 0) + '</span><span>💬 ' + Number(p.commentCount || 0) + '</span></div>';
    div.addEventListener('click', function () { c.openPost(p.id); });
    return div;
  }

  function normUrl(u) {
    u = String(u || '').trim();
    if (!u) return '';
    if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;
    return 'https://' + u;
  }

  function renderWorks(works) {
    var card = $('pWorkCard');
    if (!works.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    $('pWorks').innerHTML = works.map(function (w) {
      var url = normUrl(w.url);
      return '<div class="workcard">' +
        (w.image ? '<img src="' + c.esc(w.image) + '" loading="lazy" alt=""/>' : '') +
        '<div class="wb"><b>' + c.esc(w.title || 'Untitled work') + '</b>' +
        (w.description ? '<p>' + c.esc(w.description) + '</p>' : '') +
        (url ? '<a href="' + c.esc(url) + '" target="_blank" rel="noopener noreferrer">View work</a>' : '') +
        '</div></div>';
    }).join('');
  }

  function renderLinks(links, social) {
    var out = [];
    (links || []).forEach(function (l) {
      var url = normUrl(l && l.url);
      if (!url) return;
      var label = (l && (l.label || l.title)) || 'Portfolio';
      out.push('<a href="' + c.esc(url) + '" target="_blank" rel="noopener noreferrer" title="' + c.esc((l && l.desc) || '') + '"><span>' + c.esc(label) + '</span></a>');
    });
    Object.keys(social || {}).forEach(function (k) {
      var url = normUrl(social[k]);
      if (!url) return;
      out.push('<a href="' + c.esc(url) + '" target="_blank" rel="noopener noreferrer"><span>' + c.esc(k) + '</span></a>');
    });
    var card = $('pPortCard');
    if (!out.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    $('pLinks').innerHTML = out.join('');
  }

  function loadProfile() {
    if (!profId) { $('loading').textContent = 'No profile selected.'; return; }
    $('loading').style.display = 'block';
    $('profileBody').style.display = 'none';
    c.api('/community/users/' + encodeURIComponent(profId)).then(function (r) {
      $('loading').style.display = 'none';
      if (!r.ok) { $('loading').textContent = r.d.message || 'Could not load profile.'; return; }
      var d = r.d.data;
      var u = d.user;
      $('profileBody').style.display = 'block';
      $('pAv').src = c.avatarFor(u);
      $('pName').textContent = (u.firstName || 'Hustler') + (u.lastName ? ' ' + u.lastName : '');
      $('pPosts').textContent = d.posts;
      $('pFollowers').textContent = d.followers;
      $('pLikes').textContent = d.likes;
      var bio = [u.tagline, u.bio].filter(Boolean).join(' — ');
      $('pBio').textContent = bio || '';
      $('pBio').style.display = bio ? '' : 'none';
      $('pVerified').style.display = u.kycVerified ? '' : 'none';
      var seekMap = { freelancer: 'Takes work', client: 'Hires talent', both: 'Works & hires' };
      var seek = $('pSeek');
      if (u.seekingTo && seekMap[u.seekingTo]) { seek.textContent = seekMap[u.seekingTo]; seek.style.display = ''; } else { seek.style.display = 'none'; }
      var meta = [];
      if (u.city) meta.push(c.esc(u.city));
      if (u.languages && u.languages.length) meta.push(c.esc(u.languages.slice(0, 4).join(', ')));
      if (u.createdAt) {
        try { meta.push('Joined ' + new Date(u.createdAt).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })); } catch (e) {}
      }
      $('pMeta').innerHTML = meta.map(function (m) { return '<span>' + m + '</span>'; }).join('');
      var offered = u.skillsOffered || [];
      var wanted = u.skillsNeeded || [];
      $('pSkills').innerHTML = offered.map(function (s) { return '<span>' + c.esc(s) + '</span>'; }).join('');
      $('pSkills').style.display = offered.length ? '' : 'none';
      $('pSkillsEmpty').style.display = offered.length ? 'none' : '';
      $('pWantLabel').style.display = wanted.length ? '' : 'none';
      $('pSkillsWant').innerHTML = wanted.map(function (s) { return '<span>' + c.esc(s) + '</span>'; }).join('');
      renderWorks(u.sampleWorks || []);
      renderLinks(u.portfolioLinks || [], u.socialLinks || {});
      var own = !!(me0 && me0.id === u.id);
      $('pEditBtn').style.display = own ? '' : 'none';
      $('pViewBtn').style.display = own ? '' : 'none';
      if (own) {
        $('pViewBtn').onclick = function () {
          var t = document.querySelector('.prof-caption');
          if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
      }
      var btn = $('pBtn');
      var msgBtn = $('pMsgBtn');
      if (c.token() && me0 && me0.id !== profId) {
        btn.style.display = '';
        btn.textContent = d.following ? 'Following' : 'Follow';
        btn.classList.toggle('on', !!d.following);
        btn.onclick = function () {
          if (!c.token()) { c.openLogin(); return; }
          c.api('/community/users/' + encodeURIComponent(profId) + '/follow', { method: 'POST' }).then(function (rr) {
            if (!rr.ok) { c.toast(rr.d.message || 'Failed', true); return; }
            btn.textContent = rr.d.data.following ? 'Following' : 'Follow';
            btn.classList.toggle('on', rr.d.data.following);
            $('pFollowers').textContent = Number($('pFollowers').textContent) + (rr.d.data.following ? 1 : -1);
          });
        };
        c.api('/community/connected/' + encodeURIComponent(profId)).then(function (cc) {
          if (!(cc.ok && cc.d.data && cc.d.data.connected)) return;
          msgBtn.style.display = '';
          msgBtn.onclick = function () {
            if (!c.token()) { c.openLogin(); return; }
            location.href = '/messages.html?to=' + encodeURIComponent(profId);
          };
        });
      } else if (me0 && me0.id === profId) {
        btn.style.display = 'none';
      }
      c.api('/community/feed?authorId=' + encodeURIComponent(profId) + '&limit=30').then(function (fr) {
        var posts = (fr.d.data && fr.d.data.posts) || [];
        if (!posts.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><h3>No posts yet.</h3></div>'; return; }
        grid.innerHTML = '';
        posts.forEach(function (row) { grid.appendChild(tile(row)); });
      });
    });
  }

  loadProfile();
  var t = c.token();
  if (t) { c.openPost && null; }
})();
</script>
</body>
</html>
