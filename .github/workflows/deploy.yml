name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull new code on server
        uses: appleboy/ssh-action@v1
        with:
          host: 162.19.81.122
          port: 20141
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/gritgigs
            TOKEN="${{ github.token }}"
            REPO="TechCodric-Ship-It/grit-gigs"
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            git fetch origin
            git remote set-url origin "https://github.com/${REPO}.git"
            git reset --hard origin/main
            echo "DEPLOYED: $(git log --oneline -1)"

      - name: Verify site
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 5 --retry-connrefused https://gritandgigs.in/health
          echo ""
          echo "SITE OK"
