name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Phase 0 barter protection: refuse to deploy anything whose diff touches
      # a barter-locked path or whose barter files no longer match the baseline
      # hashes in docs/prep-barter-lock.json.
      - name: Barter protection guard
        run: |
          set -euo pipefail
          node scripts/prep-guard.mjs
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/prep-guard.mjs "${{ github.event.before }}..${{ github.sha }}"
          fi

      - name: Pull new code and restart the app
        uses: appleboy/ssh-action@v1
        with:
          host: 162.19.81.122
          port: 20141
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/gritgigs
            TOKEN="${{ github.token }}"
            REPO="TechCodric-Ship-It/grit-gigs"
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
            git fetch origin
            git remote set-url origin "https://github.com/${REPO}.git"
            git reset --hard origin/main
            echo "DEPLOYED: $(git log --oneline -1)"

            # Prep (Company Report) feature flag: keep FEATURE_PREP=true in the
            # server .env across deploys (git reset never touches ignored files,
            # but this makes the enablement explicit and idempotent). The app
            # reads .env via dotenv on every boot, so the restart below picks it
            # up. To turn Prep off again, change this line to false (or remove
            # it and delete the .env entry) and push.
            ENVF=/opt/gritgigs/.env
            if grep -q '^FEATURE_PREP=' "$ENVF"; then
              sed -i 's/^FEATURE_PREP=.*/FEATURE_PREP=true/' "$ENVF"
            else
              printf '\nFEATURE_PREP=true\n' >> "$ENVF"
            fi
            echo "FEATURE_PREP: $(grep '^FEATURE_PREP=' "$ENVF")"

            # A git reset leaves the old process running the old code. TypeScript
            # changes are inert until PM2 picks them up, so restart here rather
            # than relying on someone doing it by hand afterwards.
            ERRLOG=/root/.pm2/logs/gritgigs-error.log
            # Only judge errors this deploy introduces. Grepping the whole log
            # would mean one historic error fails every future deploy forever.
            before=$(wc -c < "$ERRLOG" 2>/dev/null || echo 0)
            pm2 restart gritgigs --update-env
            sleep 12
            if ! pm2 list | grep -q "gritgigs.*online"; then
              echo "::error::gritgigs is not online after restart"
              pm2 list
              exit 1
            fi
            fresh=$(tail -c "+$((before + 1))" "$ERRLOG" 2>/dev/null || true)
            if echo "$fresh" | grep -qiE "uncaught|unhandled|fatal|Cannot find module"; then
              echo "::error::this deploy introduced errors"
              echo "$fresh" | tail -20
              exit 1
            fi
            echo "APP RESTARTED: $(pm2 list | grep gritgigs)"

      - name: Verify site is serving the deployed build
        run: |
          set -euo pipefail
          # www is canonical (the Google OAuth callback lives there), so every
          # probe must target it — the apex answers with a 308 redirect bodyless.
          BASE=https://www.gritandgigs.in
          curl -fsS --retry 5 --retry-delay 5 --retry-connrefused $BASE/health
          echo ""

          # The bare apex must keep redirecting to www, otherwise a visitor who
          # lands there signs in on an origin the OAuth popup can never reach.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://gritandgigs.in/feed)
          [ "$code" = "308" ] || { echo "::error::apex returned $code (expected 308 to www)"; exit 1; }
          echo "apex -> 308 to www OK"

          # /health answers 200 whether it is running the old code or the new
          # code, so it cannot prove a deploy landed. Compare the asset version
          # the server actually sends against the one in the deployed repo: a
          # mismatch means either the app was not restarted or a page kept a
          # stale cache-buster, both of which show users a broken UI.
          want=$(grep -ho 'feed\.css?v=[0-9]\+' public/feed.html | head -1 | grep -o '[0-9]\+$')
          echo "repo feed.css version: $want"
          for p in /feed /profile /explore; do
            got=$(curl -fsS "$BASE$p" | grep -ho 'feed\.css?v=[0-9]\+' | head -1 | grep -o '[0-9]\+$' || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p")
            echo "$p -> $code, feed.css?v=$got"
            [ "$code" = "200" ] || { echo "::error::$p returned $code"; exit 1; }
            if [ "$got" != "$want" ]; then
              echo "::error::$p serves feed.css?v=$got but repo has $want (stale process or stale page)"
              exit 1
            fi
          done

          # Spotlight boosting is retired: the explainer page must redirect to
          # the feed and the old boost API must answer 410. Either failing means
          # the server is still running the old code.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/spotlight-boost")
          [ "$code" = "302" ] || { echo "::error::spotlight-boost returned $code (expected 302)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/community/spotlight/packs")
          [ "$code" = "410" ] || { echo "::error::spotlight API returned $code (expected 410)"; exit 1; }
          echo "retired spotlight endpoints OK"

          # Prep (Company Report) is enabled: the flag probe must say so, the
          # API must answer (flag-off would 404 the gate), and the pages must
          # serve instead of redirecting to /feed. Also confirm the nav script
          # tag ships on /feed (the prep icon is injected client-side only when
          # the flag answers enabled:true).
          flag=$(curl -fsS --retry 5 --retry-delay 5 --retry-connrefused $BASE/api/prep/flag)
          echo "prep flag: $flag"
          echo "$flag" | grep -q '"enabled":true' || { echo "::error::FEATURE_PREP not enabled in production"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 "$BASE/api/prep/companies?q=infosys")
          [ "$code" = "200" ] || { echo "::error::prep API returned $code (expected 200)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/prep")
          [ "$code" = "200" ] || { echo "::error::/prep returned $code (expected 200 once enabled)"; exit 1; }
          curl -fsS "$BASE/feed" | grep -q '/js/prep-nav.js' || { echo "::error::prep-nav.js tag missing from /feed"; exit 1; }
          echo "prep enabled OK"
          echo "SITE OK"
